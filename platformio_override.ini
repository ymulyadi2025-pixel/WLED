[platformio]
default_envs = mizuma

[env:mizuma]
extends = env:esp32c3dev
build_flags = ${env:esp32c3dev.build_flags} 
  -D WLED_RELEASE_NAME='"MIZUMA"' 
  -D WLED_AP_SSID='"Mizuma SmartSystem"' 
  -D WLED_AP_PASS='"mizuma123"' 
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_INFRARED
  -D ARDUINO_USB_CDC_ON_BOOT=0
custom_usermods = mizuma_smartsystem
monitor_filters = esp32_exception_decoder

[env:mizuma_c3_debug]
extends = env:mizuma_c3_lean
build_flags = ${env:mizuma_c3_lean.build_flags}
  -D WLED_DEBUG
monitor_speed = 115200
monitor_filters = time
