[platformio]
default_envs = mizuma

[env:mizuma]
extends = env:esp32c3dev
build_flags = ${env:esp32c3dev.build_flags} -D WLED_RELEASE_NAME='"MIZUMA"' -D WLED_AP_SSID='"Mizuma SmartSystem"' -D WLED_AP_PASS='"mizuma123"'
custom_usermods = mizuma_smartsystem
monitor_filters = esp32_exception_decoder
lib_deps =
  ${env:esp32c3dev.lib_deps}
  BLE
